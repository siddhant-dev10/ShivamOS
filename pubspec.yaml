name: shivamos
description: "ShivamOS - Complete Hotel Management System for Hotel New Shivam Inn"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Cloud Backend: Supabase
  supabase_flutter: ^2.6.0

  # Local Persistence & Offline-First: SQLite (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Document Generation & Printing
  pdf: ^3.10.8
  printing: ^5.13.2

  # Security & Key-Value Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatting, Date/Time, UUID & Crypto
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

  # UI & Design System
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation for Drift
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
