name: Build ShivamOS Windows Desktop Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Windows Release Executable
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_output.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "`n=== BUILD FAILED. DISPLAYING LAST 200 LINES OF BUILD LOG ==="
            Get-Content build_output.log -Tail 200
            exit $LASTEXITCODE
          }

      - name: Package Distributable Windows Bundle
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          $distDir = "downloads/Windows/ShivamOS"
          $outZip = "ShivamOS-Windows.zip"

          if (!(Test-Path "$buildDir/shivamos.exe")) {
            Write-Error "CRITICAL: shivamos.exe was not found in $buildDir!"
            exit 1
          }

          if (Test-Path $distDir) { Remove-Item -Recurse -Force $distDir }
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -Path "$buildDir/*" -Destination $distDir -Recurse -Force

          Compress-Archive -Path "$distDir/*" -DestinationPath $outZip -Force
          Write-Host "Created $outZip successfully!"

          Write-Host "`n=== Verifying Distributable Package Contents ==="
          Get-ChildItem -Path $distDir | Select-Object Name, Length, LastWriteTime
          Write-Host "`n=== Final Zip Package Details ==="
          Get-Item $outZip | Select-Object FullName, Length

      - name: Upload Windows Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivamOS-Windows-Release
          path: ShivamOS-Windows.zip
          retention-days: 30

      - name: Upload Build Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Failure-Logs
          path: build_output.log
          retention-days: 7
