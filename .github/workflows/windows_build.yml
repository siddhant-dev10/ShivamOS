name: Build ShivamOS Windows Desktop Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Package Distributable Windows Bundle
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          $outZip = "ShivamOS-Windows.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $outZip -Force
          Write-Host "Created $outZip successfully from $buildDir"

      - name: Upload Windows Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivamOS-Windows-Release
          path: ShivamOS-Windows.zip
          retention-days: 30
